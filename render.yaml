services:
  - type: web
    name: whatsapp-booking-agent
    runtime: python
    buildCommand: pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/.playwright playwright install chromium
    startCommand: gunicorn main:app --timeout 120
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.playwright
      - key: PYTHON_VERSION
        value: 3.11.0